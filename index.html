<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="ONSET 健身工作室微信小程序界面演示">
  <title>ONSET健身工作室</title>
  <link rel="stylesheet" href="style.css">
  <script src="i18n.js" defer></script>
  <script src="native-pages.js" defer></script>
  <script src="demo-cloud.js" defer></script>
  <script src="wxml.js" defer></script>
  <script src="demo.js" defer></script>
</head>
<body>
  <div class="preview">
    <div class="preview-toolbar">
      <span id="preview-label">ONSET · 网页演示</span>
      <div class="preview-controls">
        <select id="demo-language" aria-label="语言 / Language"><option value="zh">简体中文</option><option value="en">English</option></select>
        <button type="button" id="reset-demo">重置演示</button>
      </div>
    </div>
    <div class="phone" id="phone">
      <header class="wx-header" id="wx-header">
        <button type="button" class="wx-back" id="wx-back" aria-label="返回" hidden><span></span></button>
        <span id="wx-title">ONSET健身工作室</span>
        <button class="wx-menu" id="wx-menu" type="button" aria-label="演示选项" title="演示选项"><span class="wx-dots"></span><span class="wx-circle"></span></button>
      </header>
      <div class="wx-viewport" id="wx-viewport">
        <main class="wx-content" id="wx-content"><wx-page id="wx-page"></wx-page></main>
        <div class="wx-toast" id="wx-toast" role="status" hidden></div>
        <div class="wx-overlay" id="wx-overlay" hidden></div>
      </div>
      <nav class="wx-tabs" id="wx-tabs" aria-label="底部导航"></nav>
    </div>
  </div>
</body>
</html>
